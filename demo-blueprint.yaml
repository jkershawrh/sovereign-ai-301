  final_decision_owner: Named human platform security and Launchpad reviewers
story_mapping:
  audience_question: When may a confidential workload receive a model key and what remains unproven?
  stakes: [TDX capability can be mistaken for workload identity and valid evidence can be mistaken for permission.]
  architecture_flow_ids: [attest-appraise-release, refuse-unsafe-release]
  live_proof_flow_ids: [attest-appraise-release, refuse-unsafe-release]
  comparison: One explicit REHEARSAL allow path versus six fail-closed paths
  payoff: A separable chain from capability through appraisal and resource policy to inference and human authority.
  next_journey: Open the separate Showroom and inspect challenges measurements policy refusal and blockers.
